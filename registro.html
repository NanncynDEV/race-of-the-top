<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Registro | Race of the Top 2026</title>

  <link
    rel="stylesheet"
    href="./css/bootstrap.min.css">

  <link
    rel="stylesheet"
    href="./css/app.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

      <div class="container">

        <a class="navbar-brand" href="index.html">
          Race of the Top 2026
        </a>

        <a
          href="index.html"
          class="btn btn-outline-light btn-sm">

          Volver al evento

        </a>

      </div>

    </nav>

  </header>


  <!-- =========================
       REGISTRO
  ========================== -->

  <main>

    <section class="container py-5">

      <div class="row justify-content-center">

        <div class="col-12 col-lg-8">

          <div class="text-center mb-5">

            <p class="text-uppercase mb-1">
              Participa
            </p>

            <h1>
              Registro al evento
            </h1>

            <p>
              Completa tus datos para solicitar tu registro
              a Race of the Top 2026.
            </p>

          </div>


    <section id="registro" class="container py-5">

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">

                        

                    <form name="registro-race-of-the-top"
                          method="POST"
                          data-netlify="true">

                          <input
                              type="hidden"
                              name="form-name"
                              value="registro-race-of-the-top">

                        <div class="row g-3">

                            <div class="col-12 col-md-6">
                                    <label for="nombre" class="form-label">Nombre completo</label>
                                        <input
                                                type="text"
                                                class="form-control"
                                                id="nombre"
                                                name="nombre"
                                                autocomplete="name"
                                                required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    autocomplete="email"
                                    required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input
                                    type="tel"
                                    class="form-control"
                                    id="telefono"
                                    name="telefono"
                                    autocomplete="tel"
                                  >
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="institucion" class="form-label">
                                    Institución / Empresa
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="institucion"
                                    name="institucion">
                            </div>

          <div class="col-12">
            <label for="perfil" class="form-label">Perfil del participante</label>

            <select
              class="form-select"
              id="perfil"
              name="perfil"
              required>

              <option value="" selected disabled>
                Selecciona una opción
              </option>

              <option value="estudiante">Estudiante</option>
              <option value="profesional">Profesional</option>
              <option value="empresa">Empresa / Emprendimiento</option>
              <option value="docente">Docente / Académico</option>
              <option value="otro">Otro</option>

            </select>
          </div>

          <div class="col-12">

            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="aviso"
                required>

              <label class="form-check-label" for="aviso">
                He leído y acepto el aviso de privacidad.
              </label>
            </div>

          </div>

          <div class="col-12 text-center mt-4">

            <a
          href="gracias.html"
          class="btn btn-dark px-5">

          Registrarme

        </a>


          </div>

        </div>

      </form>

    </div>
  </div>

</section>

</div>

      </div>

    </section>

  </main>


  <script src="./js/bootstrap.bundle.min.js"></script>

</body>

</html>
